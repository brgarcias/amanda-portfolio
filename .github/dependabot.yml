# Dependabot version updates. Every Monday morning it opens one pull request
# with the minor and patch releases of the npm packages, separate ones for
# major releases, and the same for the GitHub Actions used by the workflows.
# A release has to be a week old before it is proposed, so a withdrawn or
# malicious publish does not reach the project. Security updates keep their
# own schedule and ignore the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The Node types follow the Node version in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
