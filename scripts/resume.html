<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Currículo</title>
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      @font-face {
        font-family: 'DM Sans';
        font-weight: 100 1000;
        src: url('../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2')
          format('woff2-variations');
      }
      @font-face {
        font-family: 'DM Mono';
        font-weight: 400;
        src: url('../node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2')
          format('woff2');
      }
      @page {
        size: A4;
        margin: 16mm 17mm 18mm;
      }
      :root {
        --ink: #1d2320;
        --ink-soft: #3a433d;
        --muted: #5c635b;
        --line: #dddfd6;
        --line-strong: #b6bcb2;
        --accent: #b23a12;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: 'DM Sans', sans-serif;
        font-size: 9.75pt;
        line-height: 1.45;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      p,
      ul,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      .head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6pt 24pt;
        align-items: end;
        padding-bottom: 10pt;
        border-bottom: 1px solid var(--line-strong);
      }
      h1 {
        font-family: 'Fraunces', serif;
        font-size: 23pt;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      .headline {
        margin-top: 4pt;
        font-size: 10.5pt;
        color: var(--ink-soft);
      }
      .contact {
        display: grid;
        gap: 2pt;
        justify-items: end;
        color: var(--muted);
        font-family: 'DM Mono', monospace;
        font-size: 7.75pt;
        letter-spacing: 0.02em;
        line-height: 1.45;
        text-align: right;
      }
      section {
        margin-top: 11pt;
        break-inside: auto;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 8pt;
        margin-bottom: 6pt;
        color: var(--accent);
        font-family: 'DM Mono', monospace;
        font-size: 7.75pt;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        break-after: avoid;
      }
      h2::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .summary {
        max-width: 160mm;
        color: var(--ink-soft);
      }
      .role {
        margin-bottom: 7pt;
        break-inside: avoid;
      }
      .role h3 {
        font-size: 10.25pt;
        font-weight: 600;
        line-height: 1.3;
      }
      .meta {
        margin: 1pt 0 3pt;
        color: var(--muted);
        font-family: 'DM Mono', monospace;
        font-size: 7.75pt;
      }
      ul {
        padding-left: 11pt;
      }
      li {
        margin-bottom: 1.5pt;
        color: var(--ink-soft);
      }
      li::marker {
        color: var(--accent);
      }
      .plain {
        list-style: none;
        padding: 0;
      }
      .plain li {
        display: flex;
        justify-content: space-between;
        gap: 12pt;
        padding: 3pt 0;
        border-bottom: 1px solid var(--line);
      }
      .plain li span:last-child {
        color: var(--muted);
        font-family: 'DM Mono', monospace;
        font-size: 7.75pt;
        white-space: nowrap;
      }
      .skills {
        display: grid;
        gap: 3pt;
      }
      .skills p {
        color: var(--ink-soft);
      }
      .skills strong {
        color: var(--ink);
        font-weight: 600;
      }
      .foot {
        margin-top: 12pt;
        padding-top: 6pt;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: 'DM Mono', monospace;
        font-size: 7pt;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body></body>
</html>
