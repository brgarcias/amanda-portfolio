<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formulários do site</title>
  </head>
  <body>
    <!--
      Netlify detects forms only in static HTML at deploy time. The review
      form in src/components/ReviewForm.tsx posts here, and every field it
      sends must also be declared below.
    -->
    <form name="avaliacoes" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="avaliacoes" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="avaliacao" />
      <input name="nome" />
      <input name="cargo" />
      <input name="servico" />
      <textarea name="depoimento"></textarea>
      <input name="email" type="email" />
      <input name="consentimento" type="checkbox" value="sim" />
    </form>
  </body>
</html>
